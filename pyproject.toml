[project]
name = "ipo-watcher"
version = "0.1.0"
description = "Watches SEBI public-issue filings and emails alerts on new ones"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "patsy>=1.0.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]

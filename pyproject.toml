[project]
name = "ipo-watcher"
version = "0.1.0"
description = "Watches SEBI public-issue filings and emails alerts on new ones"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
